    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="styles.css">
    <noscript><style>.scroll-reveal{opacity:1;transform:none}</style></noscript>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shine {
            0% { background-position: -400% center; }
            100% { background-position: 400% center; }
        }
        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 5px rgba(212, 175, 55, 0.4), 0 0 10px rgba(212, 175, 55, 0.3), 0 0 15px rgba(212, 175, 55, 0.2), 0 5px 20px rgba(0, 0, 0, 0.7);
            }
            50% {
                text-shadow: 0 0 8px rgba(212, 175, 55, 0.5), 0 0 15px rgba(212, 175, 55, 0.4), 0 0 20px rgba(212, 175, 55, 0.3), 0 5px 25px rgba(0, 0, 0, 0.8);
            }
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }
        .fade-in-title {
            background: linear-gradient(110deg, #8b6914 0%, #c4941f 15%, #d4af37 30%, #f4e4a6 45%, #ffd700 50%, #f4e4a6 55%, #d4af37 70%, #c4941f 85%, #8b6914 100%);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 1.5s ease-out 0s 1 normal forwards, shine 8s linear 2s infinite normal none, glow 4s ease-in-out 1.5s infinite normal none, breathe 5s ease-in-out 2.5s infinite normal none;
            opacity: 0;
            letter-spacing: 0.18em;
            font-weight: 900;
            -webkit-text-stroke: 1px rgba(212, 175, 55, 0.25);
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.3));
        }
        .fade-in-menu { animation: fadeInUp 1.2s ease-out forwards; opacity: 0; }
        .fade-in-menu:nth-child(1) { animation-delay: 0.8s; }
        .fade-in-menu:nth-child(2) { animation-delay: 1s; }
        .fade-in-menu:nth-child(3) { animation-delay: 1.2s; }
        .fade-in-menu:nth-child(4) { animation-delay: 1.4s; }
        .fade-in-menu:nth-child(5) { animation-delay: 1.6s; }
        .fade-in-menu:nth-child(6) { animation-delay: 1.8s; }
        .menu-link { position: relative; transition: all 0.3s ease; }
        .menu-link:hover { color: #d4af37; transform: translateX(10px); }
        .menu-link::before {
            content: '';
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 2px;
            background: #d4af37;
            transition: width 0.3s ease;
        }
        .menu-link:hover::before { width: 20px; }
        .slide-zoom { background-size: 130% !important; background-position: center !important; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">
<a href="#contenu" class="skip-link">Aller au contenu</a>

        --img-desktop : affichée sur ordinateur / tablette (> 768px)
        --img-mobile  : affichée sur téléphone (<= 768px)

            <a href="pages/presse.html" class="menu-link fade-in-menu block py-2 text-xl md:text-3xl text-gray-100 hover:text-golden font-light tracking-wide">Presse</a>

        <button class="slide-indicator h-3 w-3 rounded-full bg-white transition" type="button" aria-label="Image 2"></button>
        <button class="slide-indicator h-3 w-3 rounded-full bg-white transition" type="button" aria-label="Image 3"></button>

</main>
